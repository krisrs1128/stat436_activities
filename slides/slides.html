### Purpose

Beyond learning outcomes, my goal is to help you,

1. Build up the practical data science skills needed to get into and excel in competitive internships, graduate programs, and industry positions.

1. Explore how looking deeply at data can exercise your creativity or bring you joy.

---

### Course Changes

This semester is the largest revision I have attempted since creating the course.

- The topics have been updated to include more modern interactive and model visualization topics.
- It's no longer a flipped class. This also means there are many fewer in-class assignments.
- We'll be experimenting with programming AI agents.

There will be some rough edges but I hope it makes the course more useful.

---

### Weekly Rhythm

1. Announcement sent on Sunday evening
1. Tuesday: Lecture + in-class exercise
1. Thursday: Lecture + in-class discussion

In-class exercises and discussions are due at the start of the next lecture.
